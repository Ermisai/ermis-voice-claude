[project]
name = "ermis-voz"
version = "0.6.2"
description = "Ermis Voice para o Claude Code: voz em pt-BR pela Ermis Voice API — microfone com cancelamento de eco, MCP, hooks e plugin."
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Ermis" }]
dependencies = [
    "numpy>=1.26",
    "sounddevice>=0.4.6",
    "websockets>=13",
    "httpx>=0.27",
    "mcp>=1.2",
    # AEC3 do WebRTC (Apache-2.0), com wheels para macOS, Linux e Windows
    "livekit>=1.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.25"]

[project.scripts]
ermis-voz = "ermis_voz.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ermis_voz"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
